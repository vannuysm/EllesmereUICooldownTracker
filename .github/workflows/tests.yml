name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Package without uploading
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d -p 1741704
      - name: Verify installed layout and ZIP contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from scripts.deploy import ADDON, validate_package

          package = Path('.release') / ADDON
          validate_package(package)
          for source in Path('src').rglob('*'):
              if source.is_file():
                  relative = source.relative_to('src')
                  assert (package / relative).is_file(), f'Missing packaged source: {relative}'
          assert (package / 'LICENSE').is_file()
          allowed = {source.name for source in Path('src').iterdir()}
          allowed.update({'LICENSE', 'CHANGELOG.md', 'CHANGELOG.txt'})
          unexpected = {entry.name for entry in package.iterdir()} - allowed
          assert not unexpected, f'Unexpected packaged entries: {unexpected}'
          expected = {f'{ADDON}/{file.relative_to(package).as_posix()}'
                      for file in package.rglob('*') if file.is_file()}
          archives = list(Path('.release').glob('*.zip'))
          assert archives, 'Packager did not create a ZIP'
          for archive in archives:
              with ZipFile(archive) as zipped:
                  actual = {name for name in zipped.namelist() if not name.endswith('/')}
                  assert actual == expected, f'Unexpected ZIP layout: {archive}'
          PY
      - name: Upload addon package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-package
          path: .release/*.zip
          if-no-files-found: error

  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3
        with:
          version: '0.13.0'
          python-version: '3.14'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit and regression tests on both Lua runtimes
        run: uv run --locked pytest tests/unit --junitxml=test-results/unit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-${{ matrix.os }}
          path: test-results/unit.xml
          if-no-files-found: ignore

  performance:
    name: Performance budgets and measurements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3
        with:
          version: '0.13.0'
          python-version: '3.14'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run performance tests on both Lua runtimes
        run: >-
          uv run --locked pytest tests/performance
          --junitxml=test-results/performance.xml
          --performance-report=test-results/performance.json
      - name: Upload test results and measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance
          path: test-results/performance.*
          if-no-files-found: ignore
