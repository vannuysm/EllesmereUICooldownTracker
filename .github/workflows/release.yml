name: Package Addon

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required by the packager to generate clean changelogs

      - name: Package EllesmereUICooldownTracker
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          # Run at the repository root; .pkgmeta moves src into the addon root.
          args: -p 1741704
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
