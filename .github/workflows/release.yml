name: Package Addon

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required by the packager to generate clean changelogs

      - name: Package EllesmereUICooldownTracker
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1741704
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
