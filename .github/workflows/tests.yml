name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3
        with:
          version: '0.13.0'
          python-version: '3.14'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit and regression tests on both Lua runtimes
        run: uv run --locked pytest tests/unit --junitxml=test-results/unit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-${{ matrix.os }}
          path: test-results/unit.xml
          if-no-files-found: ignore

  performance:
    name: Performance budgets and measurements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3
        with:
          version: '0.13.0'
          python-version: '3.14'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run performance tests on both Lua runtimes
        run: >-
          uv run --locked pytest tests/performance
          --junitxml=test-results/performance.xml
          --performance-report=test-results/performance.json
      - name: Upload test results and measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance
          path: test-results/performance.*
          if-no-files-found: ignore
